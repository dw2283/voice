<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoiceKit</title>
    <style>
      :root {
        --ink: #eff8ff;
        --muted: rgba(213, 230, 255, 0.72);
        --panel: rgba(8, 14, 27, 0.84);
        --line: rgba(120, 178, 255, 0.16);
        --voice-level: 0;
        --core-scale: calc(0.98 + (var(--voice-level) * 0.22));
        --core-glow: calc(0.36 + (var(--voice-level) * 0.6));
        --orbit-scale: calc(1 + (var(--voice-level) * 0.18));
        --accent-cyan: #72f7ff;
        --accent-ice: #9dc3ff;
        --accent-blue: #4f73ff;
        --accent-teal: #2fd9b9;
        --accent-violet: #738dff;
        --danger: #ff8e75;
      }

      * {
        box-sizing: border-box;
        user-select: none;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Avenir Next", "SF Pro Rounded", "Segoe UI", sans-serif;
        color: var(--ink);
      }

      body {
        padding: 6px;
      }

      .overlay {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      .hud {
        position: relative;
        width: 100%;
        height: 100%;
        border: 0;
        padding: 0 12px 0 7px;
        border-radius: 999px;
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr);
        align-items: center;
        gap: 9px;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 50%, rgba(114, 247, 255, 0.15), transparent 28%),
          radial-gradient(circle at 78% 24%, rgba(115, 141, 255, 0.18), transparent 34%),
          linear-gradient(142deg, rgba(12, 20, 38, 0.95), rgba(16, 28, 48, 0.82)),
          var(--panel);
        border: 1px solid var(--line);
        box-shadow:
          0 16px 38px rgba(2, 6, 15, 0.34),
          inset 0 1px 0 rgba(204, 229, 255, 0.12),
          inset 0 -1px 0 rgba(52, 100, 170, 0.16);
        backdrop-filter: blur(20px) saturate(1.35);
        cursor: pointer;
      }

      .hud:focus-visible {
        outline: none;
      }

      .hud::before {
        content: "";
        position: absolute;
        inset: -24px;
        background:
          radial-gradient(circle at 18% 50%, rgba(114, 247, 255, calc(var(--voice-level) * 0.48)), transparent 28%),
          radial-gradient(circle at 52% 32%, rgba(79, 115, 255, calc(var(--voice-level) * 0.34)), transparent 38%),
          linear-gradient(96deg, transparent, rgba(185, 225, 255, 0.16), transparent);
        opacity: 0;
        transform: translateX(-16%) rotate(7deg);
        transition: opacity 180ms ease;
        z-index: 0;
      }

      .hud::after {
        content: "";
        position: absolute;
        inset: 1px;
        border-radius: inherit;
        background:
          linear-gradient(118deg, rgba(255, 255, 255, 0.08), transparent 28%, transparent 72%, rgba(114, 247, 255, 0.08));
        pointer-events: none;
        opacity: 0.8;
      }

      .voice-mark {
        position: relative;
        width: 42px;
        height: 42px;
        z-index: 1;
        display: grid;
        place-items: center;
      }

      .aura {
        position: absolute;
        inset: 2px;
        border-radius: 999px;
        background:
          radial-gradient(circle, rgba(114, 247, 255, 0.44), rgba(79, 115, 255, 0.26) 48%, transparent 72%);
        filter: blur(12px);
        opacity: var(--core-glow);
        transform: scale(calc(0.94 + (var(--voice-level) * 0.42)));
      }

      .orbit {
        position: absolute;
        inset: 3px;
        border-radius: 999px;
        border: 1px solid rgba(147, 204, 255, 0.22);
        opacity: 0.46;
        transform: scale(var(--orbit-scale));
      }

      .orbit::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        border-top: 1px solid rgba(114, 247, 255, 0.84);
        border-right: 1px solid transparent;
        border-bottom: 1px solid transparent;
        border-left: 1px solid transparent;
        transform: rotate(var(--tilt, 0deg));
      }

      .orbit.two {
        inset: -1px;
        border-color: rgba(110, 153, 255, 0.18);
        opacity: 0.28;
      }

      .orbit.two::before {
        border-top-color: rgba(132, 162, 255, 0.72);
        --tilt: 120deg;
      }

      .spark {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 999px;
        background: white;
        box-shadow: 0 0 8px rgba(114, 247, 255, 0.85);
        opacity: 0.78;
      }

      .spark.one {
        top: 7px;
        right: 6px;
        background: var(--accent-cyan);
      }

      .spark.two {
        bottom: 8px;
        left: 6px;
        width: 3px;
        height: 3px;
        background: var(--accent-ice);
      }

      .spark.three {
        top: 18px;
        left: 2px;
        width: 2px;
        height: 2px;
        background: var(--accent-teal);
      }

      .core-shell {
        position: relative;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background:
          radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.94), transparent 18%),
          radial-gradient(circle at 50% 52%, rgba(114, 247, 255, 0.34), transparent 46%),
          conic-gradient(from 210deg, rgba(114, 247, 255, 0.8), rgba(79, 115, 255, 0.84), rgba(47, 217, 185, 0.74), rgba(114, 247, 255, 0.8));
        box-shadow:
          inset 0 0 0 1px rgba(224, 244, 255, 0.18),
          inset 0 -8px 16px rgba(9, 17, 36, 0.42),
          0 10px 20px rgba(16, 41, 90, 0.34);
        transform: scale(var(--core-scale)) rotate(calc(var(--voice-level) * 12deg));
        transition:
          transform 80ms linear,
          filter 120ms ease;
      }

      .core-shell::before {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: inherit;
        background:
          radial-gradient(circle at center, rgba(6, 16, 31, 0) 20%, rgba(6, 16, 31, 0.24) 42%, rgba(6, 16, 31, 0.78) 100%),
          linear-gradient(135deg, rgba(255, 255, 255, 0.14), transparent 55%);
      }

      .core-shell::after {
        content: "";
        position: absolute;
        inset: 7px;
        border-radius: inherit;
        border: 1px solid rgba(194, 232, 255, 0.24);
        box-shadow: inset 0 0 10px rgba(114, 247, 255, 0.18);
      }

      .core-pulse {
        position: absolute;
        inset: 9px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(114, 247, 255, 0.84), rgba(79, 115, 255, 0.24) 70%, transparent 100%);
        mix-blend-mode: screen;
        opacity: calc(0.5 + (var(--voice-level) * 0.38));
        transform: scale(calc(0.84 + (var(--voice-level) * 0.2)));
      }

      .wave {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 14px;
        height: 11px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
        opacity: 0.9;
        z-index: 2;
      }

      .bar {
        width: 2px;
        min-height: 4px;
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(114, 247, 255, 0.72));
        box-shadow: 0 0 8px rgba(114, 247, 255, 0.34);
        transform-origin: center center;
        transform: scaleY(calc(0.45 + (var(--voice-level) * var(--gain, 1))));
      }

      .bar:nth-child(1) {
        --gain: 0.85;
      }

      .bar:nth-child(2) {
        --gain: 1.35;
      }

      .bar:nth-child(3) {
        --gain: 1.9;
      }

      .bar:nth-child(4) {
        --gain: 1.35;
      }

      .bar:nth-child(5) {
        --gain: 0.88;
      }

      .text {
        position: relative;
        z-index: 1;
        min-width: 0;
        display: grid;
        gap: 1px;
        text-align: left;
      }

      .title {
        font-size: 12px;
        font-weight: 760;
        line-height: 1;
        letter-spacing: -0.025em;
        color: var(--ink);
        white-space: nowrap;
      }

      .detail {
        font-size: 9px;
        line-height: 1.2;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .hud[data-mode="arming"]::before,
      .hud[data-mode="listening"]::before,
      .hud[data-mode="processing"]::before,
      .hud[data-mode="done"]::before,
      .hud:hover::before {
        opacity: 1;
      }

      .hud[data-mode="arming"] .orbit {
        animation: ring-pulse 1.6s ease-out infinite;
      }

      .hud[data-mode="arming"] .orbit.two {
        animation-delay: 0.5s;
        opacity: 0.22;
      }

      .hud[data-mode="arming"] .core-shell {
        filter: saturate(1.16) brightness(1.06);
      }

      .hud[data-mode="arming"] .spark {
        animation: spark-shift 1.2s ease-in-out infinite alternate;
      }

      .hud[data-mode="listening"] .orbit {
        animation: ring-pulse 1.04s ease-out infinite;
      }

      .hud[data-mode="listening"] .orbit.two {
        animation-delay: 0.36s;
        opacity: 0.35;
      }

      .hud[data-mode="listening"] .core-shell {
        filter: saturate(1.28) brightness(1.08);
      }

      .hud[data-mode="listening"] .spark {
        animation: spark-orbit 0.86s linear infinite;
      }

      .hud[data-mode="listening"] .aura {
        animation: aura-breathe 0.9s ease-in-out infinite;
      }

      .hud[data-mode="processing"] .core-shell {
        animation: core-spin 1.28s linear infinite;
      }

      .hud[data-mode="processing"] .bar {
        animation: bar-scan 0.72s ease-in-out infinite;
      }

      .hud[data-mode="processing"] .orbit,
      .hud[data-mode="done"] .orbit {
        opacity: 0.44;
      }

      .hud[data-mode="done"] .core-shell {
        filter: saturate(1.38) brightness(1.12);
      }

      .hud[data-mode="done"] .aura {
        animation: success-flare 0.7s ease-out 1;
      }

      .hud[data-mode="error"] {
        border-color: rgba(255, 142, 117, 0.22);
      }

      .hud[data-mode="error"] .title,
      .hud[data-mode="error"] .detail {
        color: var(--danger);
      }

      .hud[data-mode="error"] .core-shell {
        background:
          radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.92), transparent 18%),
          conic-gradient(from 210deg, #ffd0c4, #ff755b, #c83d34, #ffd0c4);
        animation: error-jolt 0.28s linear 2;
      }

      @keyframes ring-pulse {
        0% {
          opacity: 0.55;
          transform: scale(0.86);
        }

        100% {
          opacity: 0;
          transform: scale(calc(1.2 + (var(--voice-level) * 0.5)));
        }
      }

      @keyframes core-spin {
        0%,
        100% {
          transform: scale(1) rotate(0deg);
        }

        50% {
          transform: scale(1.08) rotate(180deg);
        }
      }

      @keyframes bar-scan {
        0%,
        100% {
          opacity: 0.35;
          transform: scaleY(0.5);
        }

        50% {
          opacity: 0.9;
          transform: scaleY(1.7);
        }
      }

      @keyframes aura-breathe {
        0%,
        100% {
          opacity: calc(0.42 + (var(--voice-level) * 0.48));
          transform: scale(calc(0.92 + (var(--voice-level) * 0.3)));
        }

        50% {
          opacity: calc(0.56 + (var(--voice-level) * 0.62));
          transform: scale(calc(1 + (var(--voice-level) * 0.38)));
        }
      }

      @keyframes spark-orbit {
        0% {
          transform: translate3d(0, 0, 0) scale(0.9);
          opacity: 0.55;
        }

        50% {
          transform: translate3d(1px, -1px, 0) scale(1.16);
          opacity: 1;
        }

        100% {
          transform: translate3d(-1px, 1px, 0) scale(0.9);
          opacity: 0.6;
        }
      }

      @keyframes spark-shift {
        from {
          opacity: 0.45;
          transform: scale(0.85);
        }

        to {
          opacity: 0.95;
          transform: scale(1.18);
        }
      }

      @keyframes success-flare {
        0% {
          opacity: 0.42;
          transform: scale(0.92);
        }

        40% {
          opacity: 1;
          transform: scale(1.24);
        }

        100% {
          opacity: 0.54;
          transform: scale(1.02);
        }
      }

      @keyframes error-jolt {
        0%,
        100% {
          transform: translateX(0);
        }

        25% {
          transform: translateX(-1px);
        }

        75% {
          transform: translateX(1px);
        }
      }
    </style>
  </head>
  <body>
    <main class="overlay">
      <button class="hud" id="petButton" type="button" data-mode="idle" aria-label="Toggle dictation">
        <span class="voice-mark" aria-hidden="true">
          <span class="aura"></span>
          <span class="orbit"></span>
          <span class="orbit two"></span>
          <span class="spark one"></span>
          <span class="spark two"></span>
          <span class="spark three"></span>
          <span class="core-shell">
            <span class="core-pulse"></span>
            <span class="wave">
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
            </span>
          </span>
        </span>
        <span class="text">
          <span class="title" id="petLabel">Voice</span>
          <span class="detail" id="statusPill">Ready to dictate.</span>
        </span>
      </button>
    </main>

    <script type="module" src="./pet.mjs"></script>
  </body>
</html>
