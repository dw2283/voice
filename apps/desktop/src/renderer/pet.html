<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Flow</title>
    <style>
      :root {
        --ink: #15120f;
        --muted: rgba(35, 31, 26, 0.62);
        --panel: rgba(255, 251, 243, 0.88);
        --line: rgba(31, 26, 20, 0.12);
        --voice-level: 0;
        --orb-scale: calc(1 + (var(--voice-level) * 0.2));
        --orb-glow: calc(0.35 + (var(--voice-level) * 0.55));
        --orb-warp-a: calc(44% + (var(--voice-level) * 16%));
        --orb-warp-b: calc(56% - (var(--voice-level) * 10%));
        --accent-hot: #ff8b55;
        --accent-warm: #ffd071;
        --accent-cool: #5de1ff;
        --accent-deep: #435bff;
        --danger: #b84a32;
      }

      * {
        box-sizing: border-box;
        user-select: none;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Avenir Next", "SF Pro Rounded", "Segoe UI", sans-serif;
        color: var(--ink);
      }

      body {
        padding: 6px;
      }

      .overlay {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      .hud {
        position: relative;
        width: 100%;
        height: 100%;
        border: 0;
        padding: 0 12px 0 8px;
        border-radius: 999px;
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        overflow: hidden;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.88), rgba(255, 245, 229, 0.7)),
          radial-gradient(circle at 16% 26%, rgba(255, 151, 87, 0.2), transparent 36%),
          var(--panel);
        border: 1px solid var(--line);
        box-shadow:
          0 12px 30px rgba(41, 28, 17, 0.16),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(18px) saturate(1.25);
        cursor: pointer;
      }

      .hud:focus-visible {
        outline: none;
      }

      .hud::before {
        content: "";
        position: absolute;
        inset: -24px;
        background:
          radial-gradient(circle at 18% 50%, rgba(255, 139, 85, calc(var(--voice-level) * 0.4)), transparent 30%),
          radial-gradient(circle at 45% 30%, rgba(93, 225, 255, calc(var(--voice-level) * 0.35)), transparent 34%),
          linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.36), transparent);
        opacity: 0;
        transform: translateX(-16%) rotate(8deg);
        transition: opacity 180ms ease;
        z-index: 0;
      }

      .voice-mark {
        position: relative;
        width: 38px;
        height: 38px;
        z-index: 1;
        display: grid;
        place-items: center;
      }

      .orb-shadow {
        position: absolute;
        inset: 6px;
        border-radius: 999px;
        background: rgba(255, 139, 85, 0.34);
        filter: blur(10px);
        opacity: var(--orb-glow);
        transform: scale(calc(0.96 + (var(--voice-level) * 0.5)));
      }

      .orb-ring {
        position: absolute;
        inset: 2px;
        border-radius: 999px;
        border: 1px solid rgba(255, 139, 85, 0.2);
        opacity: 0.35;
      }

      .orb-ring.two {
        inset: -2px;
        border-color: rgba(93, 225, 255, 0.14);
        opacity: 0;
      }

      .orb-core {
        position: relative;
        width: 28px;
        height: 28px;
        border-radius: var(--orb-warp-a) var(--orb-warp-b) 48% 58%;
        background:
          radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.92), transparent 24%),
          radial-gradient(circle at 66% 70%, rgba(67, 91, 255, 0.52), transparent 42%),
          linear-gradient(135deg, var(--accent-warm), var(--accent-hot) 48%, var(--accent-cool));
        box-shadow:
          inset 0 -5px 10px rgba(72, 36, 16, 0.16),
          0 7px 18px rgba(255, 139, 85, 0.24);
        transform: scale(var(--orb-scale)) rotate(calc(var(--voice-level) * 10deg));
        transition:
          border-radius 120ms ease,
          transform 80ms linear,
          filter 120ms ease;
      }

      .wave {
        position: absolute;
        left: 50%;
        bottom: 5px;
        width: 18px;
        height: 11px;
        transform: translateX(-50%);
        display: flex;
        align-items: end;
        justify-content: center;
        gap: 2px;
        opacity: 0.58;
      }

      .bar {
        width: 2px;
        min-height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.88);
        transform-origin: bottom center;
        transform: scaleY(calc(0.45 + (var(--voice-level) * var(--gain, 1))));
      }

      .bar:nth-child(1) {
        --gain: 0.9;
      }

      .bar:nth-child(2) {
        --gain: 1.5;
      }

      .bar:nth-child(3) {
        --gain: 2;
      }

      .bar:nth-child(4) {
        --gain: 1.4;
      }

      .bar:nth-child(5) {
        --gain: 0.85;
      }

      .text {
        position: relative;
        z-index: 1;
        min-width: 0;
        display: grid;
        gap: 1px;
        text-align: left;
      }

      .title {
        font-size: 12px;
        font-weight: 760;
        line-height: 1;
        letter-spacing: -0.025em;
        color: var(--ink);
        white-space: nowrap;
      }

      .detail {
        font-size: 9px;
        line-height: 1.2;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .hud[data-mode="listening"]::before,
      .hud[data-mode="processing"]::before,
      .hud[data-mode="done"]::before,
      .hud:hover::before {
        opacity: 1;
      }

      .hud[data-mode="listening"] .orb-ring {
        animation: ring-pulse 1.1s ease-out infinite;
      }

      .hud[data-mode="listening"] .orb-ring.two {
        animation-delay: 0.36s;
        opacity: 0.35;
      }

      .hud[data-mode="listening"] .orb-core {
        filter: saturate(1.16) brightness(1.04);
      }

      .hud[data-mode="processing"] .orb-core {
        animation: liquid-spin 1.3s ease-in-out infinite;
      }

      .hud[data-mode="processing"] .bar {
        animation: bar-scan 0.72s ease-in-out infinite;
      }

      .hud[data-mode="done"] .orb-core {
        filter: saturate(1.25) brightness(1.08);
      }

      .hud[data-mode="error"] {
        border-color: rgba(184, 74, 50, 0.22);
      }

      .hud[data-mode="error"] .title,
      .hud[data-mode="error"] .detail {
        color: var(--danger);
      }

      .hud[data-mode="error"] .orb-core {
        background:
          radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.9), transparent 24%),
          linear-gradient(135deg, #ffd1bb, #ff6d4a 54%, #ab3e2b);
        animation: error-jolt 0.28s linear 2;
      }

      @keyframes ring-pulse {
        0% {
          opacity: 0.55;
          transform: scale(0.86);
        }

        100% {
          opacity: 0;
          transform: scale(calc(1.2 + (var(--voice-level) * 0.5)));
        }
      }

      @keyframes liquid-spin {
        0%,
        100% {
          border-radius: 48% 56% 50% 58%;
          transform: scale(1) rotate(0deg);
        }

        50% {
          border-radius: 58% 44% 62% 45%;
          transform: scale(1.08) rotate(11deg);
        }
      }

      @keyframes bar-scan {
        0%,
        100% {
          opacity: 0.35;
          transform: scaleY(0.5);
        }

        50% {
          opacity: 0.9;
          transform: scaleY(1.7);
        }
      }

      @keyframes error-jolt {
        0%,
        100% {
          transform: translateX(0);
        }

        25% {
          transform: translateX(-1px);
        }

        75% {
          transform: translateX(1px);
        }
      }
    </style>
  </head>
  <body>
    <main class="overlay">
      <button class="hud" id="petButton" type="button" data-mode="idle" aria-label="Toggle dictation">
        <span class="voice-mark" aria-hidden="true">
          <span class="orb-shadow"></span>
          <span class="orb-ring"></span>
          <span class="orb-ring two"></span>
          <span class="orb-core">
            <span class="wave">
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
            </span>
          </span>
        </span>
        <span class="text">
          <span class="title" id="petLabel">Voice</span>
          <span class="detail" id="statusPill">Ready to dictate.</span>
        </span>
      </button>
    </main>

    <script type="module" src="./pet.mjs"></script>
  </body>
</html>
