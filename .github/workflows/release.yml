name: Release Mac Beta

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  mac-beta:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build, sign, notarize, and publish
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build:fn-listener
          npx electron-builder --config apps/desktop/electron-builder.mjs --mac --universal --publish always

      - name: Verify Gatekeeper assessment
        run: spctl --assess --type exec -vv "apps/desktop/dist/mac-universal/Voice Flow.app"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voice-flow-mac-beta
          path: apps/desktop/dist/*
